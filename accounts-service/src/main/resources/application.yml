server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  config:
    # Local development: loads the root .env when present (working dir = repo root or service folder).
    # In Docker/CI the variables come from the environment.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: accounts-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:accounts_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Lets the service start on a database created with BaseDatos.sql (schema up to V4) instead of failing.
    baseline-on-migrate: true
    baseline-version: 4
  web:
    locale: en
    locale-resolver: fixed
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # Failed messages are retried with backoff and then dead-lettered instead of being requeued forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
