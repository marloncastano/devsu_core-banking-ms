server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  config:
    # Local development: loads the root .env when present (working dir = repo root or service folder).
    # In Docker/CI the variables come from the environment.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: customers-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customers_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    locale: en
    locale-resolver: fixed
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # The broker confirms every published event; unroutable messages are returned and logged.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
